<form class="inline" data-patra-form="reply">
  <label><span class="label">Reply</span><textarea name="body" rows="3" required>{{values.body}}</textarea></label>
  {{#error}}<p class="error" role="alert">{{error}}</p>{{/error}}
  <div class="actions"><button type="submit" class="primary">Reply</button><button type="button" data-patra-cancel>Cancel</button></div>
</form>
