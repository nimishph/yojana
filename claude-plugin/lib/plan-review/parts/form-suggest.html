<form class="inline" data-patra-form="suggest">
  <label><span class="label">Title</span><input name="title" value="{{values.title}}" required></label>
  <label><span class="label">Text</span><textarea name="text" rows="8">{{values.text}}</textarea></label>
  <label><span class="label">Why (optional)</span><textarea name="why" rows="2">{{values.why}}</textarea></label>
  {{#error}}<p class="error" role="alert">{{error}}</p>{{/error}}
  <div class="actions"><button type="submit" class="primary">Open as a change</button><button type="button" data-patra-cancel>Cancel</button></div>
</form>
